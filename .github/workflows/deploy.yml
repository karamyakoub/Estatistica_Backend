name: Estatistica - Build and Deploy

on:
  push:
    branches:
      - dev
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore Estatistica.WebAPI/Estatistica.WebAPI.csproj
          dotnet restore Estatistica.Services/Estatistica.Services.csproj

      - name: Build WebAPI
        run: |
          dotnet build Estatistica.WebAPI/Estatistica.WebAPI.csproj \
            --configuration Release \
            --no-restore

      - name: Build Services
        run: |
          dotnet build Estatistica.Services/Estatistica.Services.csproj \
            --configuration Release \
            --no-restore

      - name: Publish WebAPI
        run: |
          dotnet publish Estatistica.WebAPI/Estatistica.WebAPI.csproj \
            --configuration Release \
            --no-build \
            --output ./publish/api

      - name: Publish Services
        run: |
          dotnet publish Estatistica.Services/Estatistica.Services.csproj \
            --configuration Release \
            --no-build \
            --output ./publish/services

      - name: Upload WebAPI to staging
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "publish/api/*"
          target: "/var/www/deploy/estatistica_webapi"
          strip_components: 2

      - name: Upload Services to staging
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "publish/services/*"
          target: "/var/www/deploy/services/estatistica_services"
          strip_components: 2

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo /usr/local/bin/deploy-estatistica